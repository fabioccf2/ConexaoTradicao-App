name: Android CI
 
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
 
jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
 
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4
 
      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: 3. Cache do Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: 4. Permissão de execução do Gradle Wrapper
        run: chmod +x ./gradlew
 
      - name: 5. Android Lint (relatório, não bloqueia)
        run: ./gradlew lintDebug
        continue-on-error: true
 
      - name: 6. Testes unitários (JUnit)
        run: ./gradlew testDebugUnitTest
 
      - name: 7. Build do APK
        run: ./gradlew assembleDebug
 
      - name: 8. Publicar APK e relatório do Lint
        uses: actions/upload-artifact@v4
        with:
          name: conexao-tradicao-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
 
